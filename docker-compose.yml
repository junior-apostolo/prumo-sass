services:
  postgres:
    image: postgres:16-alpine
    container_name: enge-pro-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: enge
      POSTGRES_PASSWORD: enge_dev
      POSTGRES_DB: enge_pro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
